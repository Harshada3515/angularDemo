<h2 class="mb-3">Manage Products</h2>

<!--  Add / Edit Form -->
<div class="card p-3 shadow-sm mb-4">
    <h4>{{ isEdit ? 'Edit Product' : 'Add New Product' }}</h4>

    <div class="row mt-3">

        <!-- Product Name -->
        <div class="col-md-6 mb-3">
            <label>Product Name</label>
            <input class="form-control" [(ngModel)]="newProduct.name">
        </div>

        <!-- Price -->
        <div class="col-md-3 mb-3">
            <label>Price</label>
            <input type="number" class="form-control" [(ngModel)]="newProduct.price">
        </div>

        <!-- Stock -->
        <div class="col-md-3 mb-3">
            <label>Stock</label>
            <input type="number" class="form-control" [(ngModel)]="newProduct.stock">
        </div>

        <!-- Used For -->
        <div class="col-md-6 mb-3">
            <label>Used For</label>
            <input class="form-control" [(ngModel)]="newProduct.usedFor">
        </div>

        <!-- Description -->
        <div class="col-md-6 mb-3">
            <label>Description</label>
            <textarea class="form-control" [(ngModel)]="newProduct.description" rows="2"></textarea>
        </div>

        <!-- Specifications -->
        <div class="col-12 mt-4">
            <h5>Specifications</h5>
            <div *ngFor="let spec of newProduct.specifications; let i = index" class="row align-items-center mb-2">
                <div class="col-md-5">
                    <input class="form-control" placeholder="Specification Name" [(ngModel)]="spec.name"
                        name="specName{{i}}">
                </div>
                <div class="col-md-5">
                    <input class="form-control" placeholder="Specification Value" [(ngModel)]="spec.value"
                        name="specValue{{i}}">
                </div>
                <div class="col-md-2 text-center">
                    <button class="btn btn-danger btn-sm" (click)="removeSpecification(i)">Remove</button>
                </div>
            </div>
            <button class="btn btn-outline-primary btn-sm" (click)="addSpecification()">+ Add Specification</button>
        </div>

        <!-- Buttons -->
        <div class="col-12 mt-4">
            <button class="btn btn-primary">Add Product</button>
            <button class="btn btn-success" >Update Product</button>
            <button class="btn btn-secondary ms-2" >Clear</button>
        </div>

    </div>
</div>
