<div class="container-fluid mt-2 bg-secondary p-3">
    <h3>Reactive Form</h3>
    <h5>FormGroup</h5>
</div>
<div class="conatiner mt-2">
    <form class="row g-3" [formGroup]="studentForm">
        <div class="col-6">
            <label for="fname" class="form-label">First Name</label>
            <input type="text" formControlName="fname" name="fname" id="fname" class="form-control"
                placeholder="John">
            @if(studentForm.controls['fname'].touched || studentForm.controls['fname'].dirty){
                <div class="text-danger">
                    @if(studentForm.controls['fname'].errors?.['required']){
                        <span>*</span>
                    }
                    @else if(studentForm.controls['fname'].errors?.['minlength']){
                    <span>min 2 char</span>
                    }
                </div>
            }
        </div>
        <div class="col-6">
            <label for="lname" class="form-label">Last Name</label>
            <input type="text" formControlName="lname" name="lname" id="lname" class="form-control"
                placeholder="Cena">
        </div>
        <div class="col-12">
            <label for="address" class="form-label">Address</label>
            <input type="text" formControlName="address" name="address" class="form-control" id="address"
                placeholder="1234 Main St">
        </div>
        <div class="col-3">
            <label for="mobile" class="form-label">Mobile</label>
            <input type="text" formControlName="mobile" id="mobile" class="form-control"
                placeholder="+91 9011293700">
        </div>
        <div class="col-2">
            <label for="age" class="form-label">Age</label>
            <input type="text" formControlName="age" name="age" id="age" class="form-control" placeholder="">
        </div>
        <div class="col-7">
            <label for="email" class="form-label">Email</label>
            <input type="email" formControlName="email" name="email" id="email" class="form-control"
                placeholder="abc@gmail.com">
        </div>
        <div class="col-4">
            <input type="radio" formControlName="gender" value="Male" id="male"
                class="form-check-input mx-2">
            <label for="male" class="form-check-label">Male</label>
            <input type="radio" formControlName="gender" value="Female" id="female"
                class="mx-2 form-check-input">
            <label for="female" class="form-check-label">Female</label>
        </div>
        <div class="col-4">
            <label for="username" class="form-label">Username</label>
            <input type="text" formControlName="username" name="username" id="username" class="form-control"
                placeholder="">
        </div>
        <div class="col-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" formControlName="password"  name="password" id="password" class="form-control"
                placeholder="">
        </div>
        <div class="col-12">
            <div class="form-check">
                <input class="form-check-input" formControlName="isAcceptTerms"  name="isAcceptTerms" type="checkbox"
                    id="gridCheck">
                <label class="form-check-label" for="gridCheck">
                    Terms & Condition
                </label>
            </div>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary" (click)="signUp()">Sign Up</button>
            <button type="reset" class="btn btn-secondary ms-3" (click)="resetForm()">Reset</button>
        </div>
    </form>
</div>
